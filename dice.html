<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dice Roller</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; max-width: 520px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    label { display:block; margin: 12px 0 6px; font-weight: 600; }
    select, input, button { width: 100%; padding: 10px; font-size: 16px; }
    button { margin-top: 14px; cursor: pointer; }
    .result { margin-top: 16px; padding: 12px; border-radius: 12px; background: #f6f6f6; }
    .big { font-size: 36px; font-weight: 800; line-height: 1.1; }
    .muted { color:#666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎲 Dice Roller + Outcome</h1>

    <label for="count">Number of dice</label>
    <select id="count">
      <option>1</option><option>2</option><option>3</option><option>4</option>
    </select>

    <label for="die">Die type</label>
    <select id="die">
      <option value="4">d4</option>
      <option value="6">d6</option>
      <option value="8">d8</option>
      <option value="10">d10</option>
      <option value="12">d12</option>
      <option value="20" selected>d20</option>
      <option value="100">d100</option>
    </select>

    <label for="mod">Modifier (optional)</label>
    <input id="mod" type="number" value="0" />

    <button id="rollBtn">ROLL</button>

    <div class="result" id="output" aria-live="polite">
      <div class="muted">Press roll to begin.</div>
    </div>
  </div>

  <script>
    // Outcome table for a single d20 roll total (customize these!)
    // Each entry: [minInclusive, maxInclusive, label]
    const d20Outcomes = [
      [1, 5,  "Failure"],
      [6, 10, "Partial Failure"],
      [11, 15,"Partial Success"],
      [16, 20,"Success"]
    ];

    function rollDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function outcomeFor(total, dieSides) {
      // Right now only maps d20 nicely; for other dice, return a generic label.
      if (dieSides !== 20) return "Rolled!";
      for (const [min, max, label] of d20Outcomes) {
        if (total >= min && total <= max) return label;
      }
      return "Rolled!";
    }

    document.getElementById("rollBtn").addEventListener("click", () => {
      const count = parseInt(document.getElementById("count").value, 10);
      const dieSides = parseInt(document.getElementById("die").value, 10);
      const mod = parseInt(document.getElementById("mod").value || "0", 10);

      const rolls = Array.from({length: count}, () => rollDie(dieSides));
      const sum = rolls.reduce((a,b) => a + b, 0);
      const total = sum + mod;

      const label = outcomeFor(total, dieSides);

      document.getElementById("output").innerHTML = `
        <div class="big">${total}</div>
        <div><strong>${label}</strong></div>
        <div class="muted">Rolls: ${rolls.join(", ")} ${mod ? ` • Modifier: ${mod >= 0 ? "+" : ""}${mod}` : ""}</div>
      `;
    });
  </script>
</body>
</html>
